<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
<style>
html,body{overflow:hidden}body{font:14px system-ui;margin:0;padding:4px}
h4{margin:10px 0 4px;font-size:13px;color:#44546f}h5{margin:8px 0 2px;font-size:12px;color:#44546f}ul{margin:2px 0 4px;padding-left:18px}li{margin:1px 0}p{margin:2px 0}
.l{border:1px solid #dfe1e6;border-radius:6px;padding:8px;margin:0 0 8px}.erro{border-color:#c9372c}
.t{display:inline-block;border-radius:3px;padding:1px 6px;color:#fff;font-size:12px}
.red{background:#c9372c}.yellow{background:#7f5f01}.green{background:#1f845a}.gray{background:#626f86}
.barra{background:#dfe1e6;border-radius:4px;height:8px;margin:6px 0 2px}.barra div{background:#1f845a;height:8px;border-radius:4px}
.sub{margin:6px 0 0 12px;border-left:3px solid #dfe1e6;padding-left:8px}details{margin:6px 0}summary{cursor:pointer;color:#0c66e4}small{color:#626f86}button{margin-top:6px}
</style>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./config.js"></script>
<script src="./api.js"></script>
<script src="./render.js"></script>
</head>
<body>
<div id="c">Carregando…</div>
<script>
const t = TrelloPowerUp.iframe({ appKey: (window.INTERDEP2 || {}).APP_KEY, appName: (window.INTERDEP2 || {}).APP_NAME });
const R = window.InterdepRender;
const c = document.getElementById("c");
function ajustar() { t.sizeTo(c.offsetHeight + 24); }

async function ver() {
  if (!Interdep2.configurado()) {
    c.innerHTML = "<small>Power-Up ainda não configurado (faltam o endereço do servidor e a chave de API).</small>";
    return ajustar();
  }
  try {
    const { id } = await t.card("id");
    c.innerHTML = R.htmlPorPapel(await Interdep2.status(t, id)) + '<div><button data-acao="atualizar">Atualizar</button></div>';
  } catch (e) {
    if (e.codigo === "sem_autorizacao" || e.codigo === 401) {
      c.innerHTML = '<small>Para ver o resumo de outra área, autorize o Power-Up (ele só confirma quem você é).</small><br>' +
        '<button class="mod-primary" data-acao="autorizar">Autorizar</button>';
    } else {
      c.innerHTML = R.htmlErro(e.message || "Não consegui ler o status.");
    }
  }
  ajustar();
}

c.addEventListener("toggle", ajustar, true);   // abrir/fechar "Ver as atividades" muda a altura
c.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button[data-acao]");
  if (!b) return;
  try {
    if (b.dataset.acao === "autorizar") { await Interdep2.autorizar(t); }
    if (b.dataset.acao === "desfazer") {
      const textoDesfazer = b.dataset.existente
        ? "Desfazer o vínculo? Só o vínculo será removido: o card da área de destino já existia e NÃO será arquivado."
        : "Desfazer o vínculo? O card da área de destino será arquivado e deixará de estar ligado a este projeto (reabri-lo depois NÃO restaura o vínculo).";
      if (!confirm(textoDesfazer)) return;
      b.disabled = true;
      const { id } = await t.card("id");
      await Interdep2.desfazer(t, b.dataset.id || id);
    }
  } catch (e) { alert(e.message || "Não foi possível concluir."); }
  ver();
});

t.render(ver);
</script>
</body>
</html>
