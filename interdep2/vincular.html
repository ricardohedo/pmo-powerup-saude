<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
<style>body{font:14px system-ui;margin:0;padding:8px}small{color:#626f86}button{width:100%;margin:6px 0}.erro{color:#c9372c}label.ar{display:block;margin:6px 0;cursor:pointer}label.ar input{margin-right:6px}</style>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./config.js"></script>
<script src="./api.js"></script>
<script src="./render.js"></script>
</head>
<body>
<div id="c">Carregando…</div>
<script>
const t = TrelloPowerUp.iframe({ appKey: (window.INTERDEP2 || {}).APP_KEY, appName: (window.INTERDEP2 || {}).APP_NAME });
const R = window.InterdepRender;
const cfg = window.INTERDEP2 || {};
const c = document.getElementById("c");
function ajustar() { t.sizeTo(c.offsetHeight + 16); }

async function montar() {
  if (!Interdep2.configurado()) { c.innerHTML = "<small>Power-Up ainda não configurado.</small>"; return ajustar(); }
  // area do quadro atual (para nao oferecer a propria area): vem do endereco do quadro (/b/<shortLink>/...)
  const { url } = await t.board("url");
  const atual = (/\/b\/([A-Za-z0-9]+)/.exec(url || "") || [])[1];
  const outras = (cfg.AREAS || []).filter((a) => a.key !== atual);
  if (!outras.length) { c.innerHTML = "<small>Não há outra área liberada para este quadro.</small>"; return ajustar(); }
  c.innerHTML = R.htmlEscolhaAreas(outras);
  ajustar();
  document.getElementById("ok").onclick = async () => {
    const msg = document.getElementById("msg"), btn = document.getElementById("ok");
    const marcadas = [...c.querySelectorAll("input[type=checkbox]:checked")].map((i) => i.value);
    if (!marcadas.length) { msg.innerHTML = '<div class="erro">Marque pelo menos uma área.</div>'; return ajustar(); }
    btn.disabled = true; msg.textContent = "Criando…"; ajustar();
    const resultados = [];
    try {
      if (!(await t.getRestApi().isAuthorized())) { await Interdep2.autorizar(t); }
      const { id } = await t.card("id");
      for (const chave of marcadas) {              // uma por vez: o backend cria 1 gancho por area e nao duplica
        const nome = (outras.find((a) => a.key === chave) || {}).nome || chave;
        try {
          const r = await Interdep2.vincular(t, id, chave);
          resultados.push({ nome, ok: true, jaExistia: !!r.jaExistia });
        } catch (e) { resultados.push({ nome, ok: false, erro: (e && e.message) || "" }); }
      }
    } catch (e) { resultados.push({ nome: "Autorização", ok: false, erro: (e && e.message) || "" }); }
    msg.innerHTML = R.resumoVinculos(resultados);
    btn.disabled = false; ajustar();
    if (resultados.every((r) => r.ok)) { setTimeout(() => t.closePopup(), 2500); }
  };
}
t.render(montar);
</script>
</body>
</html>
