<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
<style>body{font:14px system-ui;margin:0;padding:8px}small{color:#626f86}button{width:100%;margin:6px 0}.erro{color:#c9372c}label.ar{display:block;margin:6px 0;cursor:pointer}label.ar input{margin-right:6px}select{width:100%;margin:6px 0}.l{border:1px solid #dfe1e6;border-radius:6px;padding:8px;margin:6px 0}.cod{font-size:20px;letter-spacing:3px}</style>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./config.js"></script>
<script src="./api.js"></script>
<script src="./render.js"></script>
</head>
<body>
<div id="c">Carregando…</div>
<script>
const t = TrelloPowerUp.iframe({ appKey: (window.INTERDEP2 || {}).APP_KEY, appName: (window.INTERDEP2 || {}).APP_NAME });
const R = window.InterdepRender;
const cfg = window.INTERDEP2 || {};
const c = document.getElementById("c");
function ajustar() { t.sizeTo(c.offsetHeight + 16); }

async function montar() {
  if (!Interdep2.configurado()) { c.innerHTML = "<small>Power-Up ainda não configurado.</small>"; return ajustar(); }
  // area do quadro atual (para nao oferecer a propria area): vem do endereco do quadro (/b/<shortLink>/...)
  const { url } = await t.board("url");
  const atual = (/\/b\/([A-Za-z0-9]+)/.exec(url || "") || [])[1];
  // Lista de areas: a do backend (fixas + quadros "Projetos da Area" reconhecidos por regra). Sem autorizacao ainda, ou se o backend nao
  // responder, vale a lista fixa do config.js (reserva). Quadros de teste (oculta) nunca aparecem.
  let lista = (cfg.AREAS || []).filter((a) => !a.oculta);
  let liberado = (cfg.AREAS || []).concat(cfg.ORIGENS_EXTRAS || []).some((a) => a.key === atual);
  try {
    if (await t.getRestApi().isAuthorized()) {
      const r = await Interdep2.areas(t, atual);
      if (Array.isArray(r.areas)) { lista = r.areas; }
      liberado = liberado || !!r.atualLiberado;
    }
  } catch (e) { /* fica a lista fixa */ }
  if (!liberado) { c.innerHTML = "<small>Este quadro ainda não está liberado para vínculos entre áreas.</small>"; return ajustar(); }
  const outras = lista.filter((a) => a.key !== atual && !a.oculta);
  if (!outras.length) { c.innerHTML = "<small>Não há outra área liberada para este quadro.</small>"; return ajustar(); }
  // So ajuda de tela: esconde as areas que ja estao na cadeia ou ja tem gancho deste card. O servidor recusa de qualquer jeito.
  // Sem autorizacao ainda, nao chama o servidor (nao forca a janela de autorizacao ao abrir).
  let disponiveis = outras;
  try {
    if (await t.getRestApi().isAuthorized()) {
      const { id } = await t.card("id");
      const st = await Interdep2.status(t, id);
      const bloq = (st && st.bloqueadas) || [];
      disponiveis = outras.filter((a) => bloq.indexOf(a.key) < 0);
    }
  } catch (e) { disponiveis = outras; }
  if (!disponiveis.length) { c.innerHTML = "<small>Todas as áreas liberadas já estão ligadas a este projeto ou fazem parte da cadeia dele.</small>"; return ajustar(); }
  c.innerHTML = R.htmlEscolhaAreas(disponiveis) + R.htmlConvite(disponiveis);
  ajustar();
  document.getElementById("conv-ok").onclick = async () => {
    const msg = document.getElementById("conv-msg"), btn = document.getElementById("conv-ok");
    btn.disabled = true; msg.textContent = "Gerando…"; ajustar();
    try {
      if (!(await t.getRestApi().isAuthorized())) { await Interdep2.autorizar(t); }
      const { id } = await t.card("id");
      msg.innerHTML = R.htmlCodigo(await Interdep2.convidar(t, id, document.getElementById("conv-area").value));
    } catch (e) { msg.innerHTML = '<div class="erro">' + R.esc((e && e.message) || "Não foi possível gerar o convite.") + "</div>"; }
    btn.disabled = false; ajustar();
  };
  document.getElementById("ok").onclick = async () => {
    const msg = document.getElementById("msg"), btn = document.getElementById("ok");
    const marcadas = [...c.querySelectorAll("input[type=checkbox]:checked")].map((i) => i.value);
    if (!marcadas.length) { msg.innerHTML = '<div class="erro">Marque pelo menos uma área.</div>'; return ajustar(); }
    btn.disabled = true; msg.textContent = "Criando…"; ajustar();
    const resultados = [];
    try {
      if (!(await t.getRestApi().isAuthorized())) { await Interdep2.autorizar(t); }
      const { id } = await t.card("id");
      for (const chave of marcadas) {              // uma por vez: o backend cria 1 gancho por area e nao duplica
        const nome = (outras.find((a) => a.key === chave) || {}).nome || chave;
        try {
          const r = await Interdep2.vincular(t, id, chave);
          resultados.push({ nome, ok: true, jaExistia: !!r.jaExistia, doModelo: r.doModelo });
        } catch (e) { resultados.push({ nome, ok: false, erro: (e && e.message) || "" }); }
      }
    } catch (e) { resultados.push({ nome: "Autorização", ok: false, erro: (e && e.message) || "" }); }
    msg.innerHTML = R.resumoVinculos(resultados) + '<br><small>Use "Atualizar" na seção do card para ver o andamento.</small>';
    btn.disabled = false; ajustar();
    if (resultados.every((r) => r.ok)) { setTimeout(() => t.closePopup(), 2500); }
  };
}
t.render(montar);
</script>
</body>
</html>
