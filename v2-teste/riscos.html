<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riscos e premissas</title>
<link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./motor.js?v=202611121717"></script>
<script src="./dados.js?v=202611121717"></script>
<script src="./tendencia.js?v=202611121717"></script>
<style>
 body{font:14px/1.45 system-ui,sans-serif;padding:12px;color:#172b4d}
 h3{margin:16px 0 6px} .nota{color:#5e6c84;font-size:12px}
 .foco{background:#e9f2ff;border-radius:4px;padding:10px;margin-bottom:6px}
 .ok{background:#e3fcef;border-radius:4px;padding:10px}
 ul{margin:0;padding-left:18px} li{margin:0 0 4px}
 a{color:#172b4d} .mot{color:#5e6c84;font-size:12px}
 .tag{display:inline-block;padding:0 7px;border-radius:9px;color:#fff;font-size:11px;font-weight:600;margin-right:6px}
 .missao{background:#f4f5f7;border-radius:4px;padding:10px;margin-bottom:8px}
 .barra{height:10px;background:#dfe1e6;border-radius:5px;margin:6px 0;overflow:hidden}
 .barra span{display:block;height:100%;background:#2e7d4f}
 .boa{color:#1f6f43;margin:0 0 8px}
 details{margin-top:4px} summary{cursor:pointer;color:#0c66e4} details ul{margin:6px 0 0}
 .tag.P1{background:#c0392b}.tag.P2{background:#d9730d}.tag.P3{background:#b8860b}.tag.P4{background:#2e7d4f}
</style>
<style>
 .mapa{border-collapse:collapse;margin:6px 0 4px} .mapa td,.mapa th{border:1px solid #fff;text-align:center;padding:8px 14px;font-size:13px}
 .mapa td{font-weight:600;min-width:64px} .mapa th{background:#f4f5f7;font-weight:600;color:#44546f}
 .c-alto{background:#c0392b;color:#fff}.c-medio{background:#f5cd47;color:#172b4d}.c-baixo{background:#cce0ff;color:#172b4d}
 .num{display:inline-block;margin-right:14px}.num b{font-size:20px;display:block}
 .tag.alto{background:#c0392b}.tag.medio{background:#946f00}.tag.baixo{background:#2e7d4f}.tag.indefinido{background:#5e6c84}
 .como{background:#f4f5f7;border-radius:4px;padding:8px 10px;font-size:12px} code{display:block;white-space:pre-wrap;margin-top:4px}
</style>
</head>
<body>
<div id="raiz">Lendo o quadro…</div>
<script>
const t = TrelloPowerUp.iframe();
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const link = (nome, url) => "<a href='" + esc(url) + "' target='_blank' rel='noopener noreferrer'>" + esc(nome) + "</a>";
const NOME = { alto: "ALTO", medio: "MÉDIO", baixo: "BAIXO", indefinido: "?" };
const classe = (score, r) => score >= r.riscos_limite_alto ? "c-alto" : score >= r.riscos_limite_medio ? "c-medio" : "c-baixo";
const ROT = ["baixa", "média", "alta"], ROTI = ["baixo", "médio", "alto"];

PmoDados.render(t, async () => {
  const q = await PmoDados.quadro(t), r = q.regras;
  if (!(r.funcoes && r.funcoes.riscos)) {
    document.getElementById("raiz").innerHTML = "<div class='ok'>Esta tela está desligada neste quadro.</div>";
    t.sizeTo("#raiz");
    return;
  }
  const g = PmoMotor.registroDeRiscos(q.itens, r, new Date());
  let h = "<p class='nota'>" + g.riscos + (g.riscos === 1 ? " risco" : " riscos") + " e " + g.premissas + (g.premissas === 1 ? " premissa" : " premissas") +
    " em " + g.comRegistro + " de " + g.ativos + " projetos ativos.</p>";
  h += "<div><span class='num'><b>" + g.porNivel.alto + "</b>de nível alto</span><span class='num'><b>" + g.semDono + "</b>sem dono</span>" +
    "<span class='num'><b>" + g.semResposta + "</b>sem resposta</span><span class='num'><b>" + g.revisaoVencida + "</b>revisão vencida</span></div>";
  if (g.riscos) {
    h += "<h3>Matriz probabilidade × impacto</h3><table class='mapa'><tr><th></th>" + ROTI.map((x) => "<th>impacto " + x + "</th>").join("") + "</tr>";
    for (let p = 3; p >= 1; p--) {
      h += "<tr><th>prob. " + ROT[p - 1] + "</th>";
      for (let i = 1; i <= 3; i++) h += "<td class='" + classe(p * i, r) + "' title='probabilidade " + ROT[p - 1] + ", impacto " + ROTI[i - 1] + "'>" + g.matriz[p - 1][i - 1] + "</td>";
      h += "</tr>";
    }
    h += "</table><p class='nota'>Vermelho = alto, amarelo = médio, azul = baixo (probabilidade × impacto). Riscos sem probabilidade ou impacto ficam fora da matriz" +
      (g.incompletos ? " (" + g.incompletos + " agora)" : "") + ".</p>";
  }
  h += "<h3>Riscos que pedem atenção (" + g.atencaoTotal + ")</h3>";
  h += g.atencao.length ? "<ul>" + g.atencao.map((x) => "<li><span class='tag " + esc(x.nivel || "indefinido") + "'>" + (x.tipo === "premissa" ? "PREMISSA" : NOME[x.nivel]) + "</span>" +
    esc(x.texto) + " — " + link(x.projeto, x.url) + (x.flags.length ? " <span class='mot'>· " + esc(x.flags.join(", ")) + "</span>" : "") + "</li>").join("") +
    (g.mais ? "<li class='nota'>… e mais " + g.mais + "</li>" : "") + "</ul>" : "<p class='nota'>Nada pedindo atenção agora.</p>";
  h += "<h3>Projetos sem riscos registrados (" + g.semRegistroTotal + ")</h3>";
  h += g.semRegistro.length ? "<ul>" + g.semRegistro.map((x) => "<li>" + link(x.nome, x.url) + "</li>").join("") + (g.maisSemRegistro ? "<li class='nota'>… e mais " + g.maisSemRegistro + "</li>" : "") + "</ul>"
    : "<p class='nota'>Todos os projetos ativos têm riscos ou premissas registrados. 👏</p>";
  h += "<div class='como'><b>Como registrar:</b> na <b>descrição</b> do card, acrescente uma seção e escreva uma linha por item:" +
    "<code>#### ***" + esc(r.riscos_secao.toUpperCase()) + "***\n- RISCO: o que pode dar errado | prob: alta | imp: alto | dono: Ana | resposta: o que fazer | revisar: 2026-12-10\n- PREMISSA: o que estamos assumindo | dono: Ana</code>" +
    "Níveis: alta, média ou baixa (ou 3, 2, 1). O Power-Up só lê; nada é alterado.</div>";
  document.getElementById("raiz").innerHTML = h;
  t.sizeTo("#raiz");
});
</script>
</body>
</html>
