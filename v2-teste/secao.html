<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saúde do projeto</title>
<link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./motor.js?v=202611121625"></script>
<script src="./dados.js?v=202611121625"></script>
<script src="./base.js?v=202611121625"></script>
<style>
 body{font:14px/1.45 system-ui,sans-serif;margin:0;padding:4px 2px;color:#172b4d}
 .topo{display:flex;align-items:center;gap:8px;margin-bottom:8px}
 .sel{display:inline-block;padding:2px 10px;border-radius:10px;color:#fff;font-weight:600}
 .sel.vermelho{background:#c0392b}.sel.amarelo{background:#b8860b}.sel.verde{background:#2e7d4f}
 .sel.P1{background:#c0392b}.sel.P2{background:#d9730d}.sel.P3{background:#b8860b}.sel.P4{background:#2e7d4f}
 .risco{padding:6px 8px;border-left:4px solid #b8860b;background:#fff7e0;border-radius:3px;margin-bottom:8px}.risco.alto{border-left-color:#c0392b;background:#fdecea}
 .risco small{display:block;color:#5e6c84}
 .prog{height:6px;background:#dfe1e6;border-radius:3px;overflow:hidden;margin:2px 0 10px}.prog i{display:block;height:100%;background:#2e7d4f}
 ul{margin:0 0 8px;padding-left:0;list-style:none}
 li{padding:6px 8px;border-left:4px solid #c0392b;background:#f7f8f9;color:#172b4d;border-radius:3px;margin-bottom:5px}
 li.amarelo{border-left-color:#b8860b} li.verde{border-left-color:#2e7d4f}
 li small{display:block;color:#5e6c84}
 .nota{color:#5e6c84;font-size:12px;margin:6px 0 0}
 .base button{margin-top:4px;padding:4px 10px;border:1px solid #c1c7d0;border-radius:4px;background:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="raiz">Lendo o card…</div>
<script>
const t = TrelloPowerUp.iframe();
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ROTULO = { vermelho: "Atenção", amarelo: "De olho", verde: "Em dia" };
const ehMarco = (d) => (d.card.labels || []).some((l) => (d.regras.labels_marco || []).includes(((l && l.name) || "").trim().toLowerCase()));
async function desenhar() {
  const d = await PmoDados.cardEmFoco(t), r = d.regras;
  const pct = PmoMotor.progressoChecklists(d.checklists, r);
  const itens = d.checklists.reduce((n, c) => n + (c.checkItems || []).length, 0);
  const feitos = d.checklists.reduce((n, c) => n + (c.checkItems || []).filter((i) => i.state === "complete").length, 0);
  let h = "<div class='topo'>" + (d.prioridade
      ? "<span class='sel " + d.prioridade + "'>" + d.prioridade + " " + esc(r.rotulo_prioridade[d.prioridade]) + "</span>"
      : "<span class='sel " + d.nivel + "'>" + ROTULO[d.nivel] + "</span>") +
    (d.alertas.length ? "<span>" + d.alertas.length + (d.alertas.length === 1 ? " sinal" : " sinais") + " neste projeto</span>" : "<span>Nenhum sinal automático.</span>") + "</div>";
  if (d.prioridade) h += "<p class='nota'>" + esc(r.fazer_prioridade[d.prioridade]) + "</p>";
  if (d.risco) h += "<div class='risco " + d.risco + "'><b>⏳ " + esc(r.rotulo_risco[d.risco]) + "</b>" +
    "<small>Prazo em " + d.diasPrazo + (d.diasPrazo === 1 ? " dia" : " dias") + " e " + (pct === null ? "sem checklist" : pct + "% do checklist") + ". " + esc(r.fazer_risco[d.risco]) + "</small></div>";
  if (d.semEvidencia) h += "<div class='risco'><b>📎 " + esc(r.rotulo_evidencia) + "</b><small>Concluído há pouco e sem anexo no card. " + esc(r.fazer_evidencia) + "</small></div>";
  if (d.valores["Fim planejado"] && !r.listas_concluido.includes((d.lista || "").trim().toLowerCase())) {
    const hoje = PmoMotor.dataLocal(new Date(), r), fimIso = PmoMotor.dataLocal(new Date(d.valores["Fim planejado"]), r);
    const du = PmoMotor.diasUteis(hoje, fimIso, r.feriados), cal = PmoMotor.diasEntre(hoje, fimIso);
    h += "<p class='nota'>" + (ehMarco(d) ? "🚩 <b>Marco</b> · " : "") + "Prazo " + esc(fimIso.slice(8, 10) + "/" + fimIso.slice(5, 7)) + ": " +
      (cal === 0 ? "vence hoje" : cal > 0 ? du + (du === 1 ? " dia útil" : " dias úteis") + " (" + cal + (cal === 1 ? " dia" : " dias") + " corridos)"
        : "passou há " + (-du) + (du === -1 ? " dia útil" : " dias úteis") + " (" + (-cal) + (cal === -1 ? " dia" : " dias") + " corridos)") +
      ". Dias úteis descontam fim de semana e os feriados do PMO.</p>";
  }
  if (pct !== null) h += "<div>Checklist: " + feitos + " de " + itens + " itens (" + pct + "%)</div><div class='prog'><i style='width:" + pct + "%'></i></div>";
  if (d.alertas.length) {
    h += "<ul>" + d.alertas.map((a) => "<li class='" + r.nivel[a.tipo] + "'><b>" + esc(PmoMotor.frase(a)) + "</b><small>👉 " + esc(r.acao[a.tipo] || "") + "</small></li>").join("") + "</ul>";
  }
  if (d.antecipacoes && d.antecipacoes.length) h += "<div class='risco'><b>⏰ Antes que aconteça</b>" + d.antecipacoes.map((x) => "<small>" + esc(x.texto) + "</small>").join("") + "</div>";
  if (d.prontidao) h += d.prontidao.faltam.length
    ? "<div class='risco'><b>🚦 Para mover para " + esc(d.prontidao.proxima) + " falta:</b>" + d.prontidao.faltam.map((x) => "<small>• " + (x.jaPendente ? esc(((d.regras.grupos && d.regras.grupos[x.tipo]) || x.frase).replace(/^\S+\s/, "")) + " (já listado acima)" : esc(x.frase) + " — " + esc(x.fazer)) + "</small>").join("") + "</div>"
    : "<p class='nota'>✅ Pronto para mover para " + esc(d.prontidao.proxima) + " (nenhuma pendência pelas regras do PMO).</p>";
  const fimAtual = d.valores["Fim planejado"] ? PmoMotor.dataLocal(new Date(d.valores["Fim planejado"]), r) : null;
  const iniAtual = d.valores["Início planejado"] ? PmoMotor.dataLocal(new Date(d.valores["Início planejado"]), r) : null;
  if (r.funcoes.linha_de_base) {
    const base = await PmoBase.ler(t), des = PmoMotor.desvioPlano(base, d.valores, r), hist = PmoMotor.historicoPlano(base, d.valores, r);
    const br = (x) => x.slice(8, 10) + "/" + x.slice(5, 7);
    const histTxt = hist ? "<small><b>Replanejado " + hist.replanejamentos + (hist.replanejamentos === 1 ? " vez" : " vezes") + "</b> (" +
      (hist.escorregou > 0 ? "escorregou " + hist.escorregou + (hist.escorregou === 1 ? " dia" : " dias") + " desde o 1º plano" : hist.escorregou < 0 ? "adiantou " + (-hist.escorregou) + (hist.escorregou === -1 ? " dia" : " dias") + " desde o 1º plano" : "mesmo fim do 1º plano") + "): " +
      hist.passos.map((p) => "fim " + esc(br(p.fim)) + " (congelado em " + esc(br(p.congelado)) + ")").join(" → ") + "</small>" : "";
    h += "<div class='risco base" + (des && des.dias > 0 ? " alto" : "") + "'><b>📐 Plano original (linha de base)</b>" +
      (des ? "<small>" + esc(des.texto) + " Congelado em " + esc(base.e.slice(8, 10) + "/" + base.e.slice(5, 7)) + ".</small>"
        : "<small>Ainda não há plano congelado neste card.</small>") + histTxt +
      (fimAtual ? "<button id='congelar'>" + (base ? "Congelar de novo (registra um replanejamento)" : "Congelar plano de hoje") + "</button>"
        : "<small>Preencha o 'Fim planejado' para poder congelar.</small>") +
      (base ? "<button id='remover'>Remover linha de base</button>" : "") + "<small id='msgbase'></small></div>";
  }
  if (r.funcoes.riscos) {            // funcao opcional: riscos e premissas escritos na DESCRICAO do card (so leitura)
    const rs = PmoMotor.riscosDoCard(d.card.desc, r, new Date()), NOME = { alto: "ALTO", medio: "MÉDIO", baixo: "BAIXO", indefinido: "?" };
    if (rs.length) h += "<div class='risco" + (rs.some((x) => x.nivel === "alto") ? " alto" : "") + "'><b>⚠️ Riscos e premissas deste projeto (" + rs.length + ")</b>" +
      rs.map((x) => "<small><b>" + (x.tipo === "premissa" ? "PREMISSA" : NOME[x.nivel]) + "</b> " + esc(x.texto) + (x.flags.length ? " — <i>" + esc(x.flags.join(", ")) + "</i>" : "") + "</small>").join("") + "</div>";
    else if (PmoMotor.projetoAtivo({ card: d.card, listaNome: d.lista }, r))
      h += "<p class='nota'>⚠️ Nenhum risco ou premissa registrado. Escreva na descrição do card, na seção " + esc(r.riscos_secao.toUpperCase()) + " (o botão Riscos do quadro mostra como).</p>";
  }
  h += "<p class='nota'>Fase: " + esc(d.lista) + ". O Power-Up não altera o card" + (r.funcoes.linha_de_base ? " (a linha de base fica guardada só no armazenamento do Power-Up)" : "") + ".</p>";
  document.getElementById("raiz").innerHTML = h;
  const bt = document.getElementById("congelar");
  if (bt) bt.onclick = async () => {
    bt.disabled = true;
    const res = await PmoBase.congelar(t, PmoMotor.dataLocal(new Date(), r), iniAtual, fimAtual);
    if (res.ok && res.semMudanca) { bt.disabled = false; document.getElementById("msgbase").textContent = "O plano de hoje é igual ao congelado: nada a registrar."; }
    else if (res.ok) desenhar(); else { bt.disabled = false; document.getElementById("msgbase").textContent = res.erro; }
  };
  const rm = document.getElementById("remover");
  if (rm) rm.onclick = async () => {                       // dois cliques: o 1o pede confirmacao (confirm() pode estar bloqueado no iframe)
    if (!rm.dataset.ok) { rm.dataset.ok = "1"; rm.textContent = "Confirmar: remover o plano original deste card?"; return; }
    rm.disabled = true;
    const res = await PmoBase.remover(t);
    if (res.ok) desenhar(); else { rm.disabled = false; document.getElementById("msgbase").textContent = res.erro; }
  };
  t.sizeTo("#raiz").catch(() => {});
  setTimeout(() => t.sizeTo("#raiz").catch(() => {}), 400);   // de novo depois do layout (evita barra de rolagem)
}
PmoDados.render(t, desenhar);
</script>
</body>
</html>
