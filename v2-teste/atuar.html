<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas ações</title>
<link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./motor.js?v=202611131739"></script>
<script src="./dados.js?v=202611131739"></script>
<style>
 body{font:14px/1.45 system-ui,sans-serif;padding:12px;color:#172b4d}
 .abas{display:flex;gap:6px;margin-bottom:12px}
 .abas button{padding:6px 12px;border:1px solid #c1c7d0;border-radius:4px;background:#fff;cursor:pointer}
 .abas button.on{background:#0c66e4;color:#fff;border-color:#0c66e4}
 .cartao{border:1px solid #dfe1e6;border-left:5px solid #c0392b;border-radius:4px;padding:8px 10px;margin:0 0 8px}
 .cartao.t1{border-left-color:#c0392b}.cartao.t2{border-left-color:#b8860b}
 .cartao b a{color:#172b4d;text-decoration:none} .cartao b a:hover{text-decoration:underline}
 .mot{color:#5e6c84;font-size:12px;margin:2px 0} .fazer{margin-top:4px}
 h3{margin:16px 0 6px} .nota{color:#5e6c84;font-size:12px} .pts{float:right;color:#5e6c84;font-size:12px}
 .ok{background:#e3fcef;border-radius:4px;padding:10px}
 .tag{display:inline-block;padding:0 7px;border-radius:9px;color:#fff;font-size:11px;font-weight:600;margin-right:6px}
 .tag.P1{background:#c0392b}.tag.P2{background:#d9730d}.tag.P3{background:#b8860b}.tag.P4{background:#2e7d4f}
 .tag.alto{background:#c0392b}.tag.medio{background:#b8860b}
</style>
</head>
<body>
<div class="abas"><button id="todos" class="on">Todos os projetos</button><button id="meus">Só os meus</button></div>
<div id="raiz">Lendo o quadro…</div>
<script>
const t = TrelloPowerUp.iframe();
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let dados = null, soMeus = false, primeiraVez = true;

function cartao(x, i, destaque) {
  const lado = destaque ? "t1" : "t2";
  return "<div class='cartao " + lado + "'><span class='pts'>" + Math.round(x.pontos) + " pts</span><b>" + (i + 1) + ". " +
    (x.prioridade ? "<span class='tag " + x.prioridade + "'>" + x.prioridade + " " + esc(dados.regras.rotulo_prioridade[x.prioridade]) + "</span>" : "") + "<a href='" + esc(x.url) +
    "' target='_blank' rel='noopener noreferrer'>" + esc(x.nome) + "</a></b><div class='mot'>" + esc(x.lista || "") + " · " + esc(x.motivos.slice(0, 3).join(" · ")) +
    (x.motivos.length > 3 ? " · +" + (x.motivos.length - 3) : "") + "</div><div class='fazer'>👉 " + esc(x.fazer) + "</div></div>";
}

function desenha() {
  const r = PmoMotor.ondeAtuar(dados.itens, dados.regras, soMeus ? dados.meuId : null);
  const semLogin = soMeus && !dados.meuId;        // sem login o motor nao sabe quem e "eu": mostra o quadro inteiro e avisa
  const pedem = r.comece.length + r.depois.length + r.resto;
  let h = semLogin ? "<p class='nota'>Entre no Trello para ver só os seus projetos; abaixo, o quadro inteiro.</p>" : "";
  if (r.total) h += "<p><b>" + (soMeus && !semLogin ? "Seus projetos" : "Todos os projetos do quadro") + ":</b> " + pedem +
    " pedindo ação, de " + r.total + ".</p>";
  if (!r.total) h = "<p class='nota'>" + (soMeus ? "Você não é membro de nenhum card aberto neste quadro." : "Nenhum card aberto.") + "</p>";
  else if (!r.comece.length) h += "<div class='ok'>🎉 Nada pedindo ação agora em " + r.total + " projetos.</div>";
  else {
    h += "<h3>" + (r.comece.length === 1 ? "Comece por este" : "Comece por estes " + r.comece.length) + "</h3>" + r.comece.map((x, i) => cartao(x, i, true)).join("");
    if (r.depois.length) h += "<h3>Depois</h3>" + r.depois.map((x, i) => cartao(x, i + r.comece.length, false)).join("");
    if (r.resto) h += "<p class='nota'>… e mais " + r.resto + " projetos pedindo atenção.</p>";
  }
  if (r.emRisco.length) h += "<h3>⏳ Em risco de atrasar (ainda no prazo)</h3><ul>" + r.emRisco.slice(0, 8).map((x) =>
    "<li><span class='tag " + x.risco + "'>" + esc(dados.regras.rotulo_risco[x.risco]) + "</span><a href='" + esc(x.url) + "' target='_blank' rel='noopener noreferrer'>" + esc(x.nome) + "</a> — vence em " + x.dias +
    (x.dias === 1 ? " dia" : " dias") + ", " + (x.pct === null ? "sem checklist" : x.pct + "% do checklist") + "</li>").join("") + "</ul>" +
    (r.emRisco.length > 8 ? "<p class='nota'>… e mais " + (r.emRisco.length - 8) + " em risco.</p>" : "");
  if (r.vitorias.length) h += "<h3>Vitórias rápidas (quase prontos)</h3><ul>" + r.vitorias.slice(0, 6).map((x) => "<li><a href='" + esc(x.url) + "' target='_blank' rel='noopener noreferrer'>" + esc(x.nome) + "</a> — falta só formalizar o encerramento</li>").join("") + "</ul>";
  h += "<p class='nota'>" + r.total + (r.total === 1 ? " projeto considerado, " : " projetos considerados, ") + r.semAtencao + " sem nada pedindo ação. A ordem usa a mesma pontuação do PMO " +
    "(atraso, prazo próximo, atraso oculto, prioridade e urgência). Pausado e em revisão sem comentário usam a contagem de comentários do Trello. Só leitura; nada é alterado.</p>";
  document.getElementById("raiz").innerHTML = h;
  document.getElementById("todos").className = soMeus ? "" : "on";
  document.getElementById("meus").className = soMeus ? "on" : "";
  t.sizeTo("body");
}

PmoDados.render(t, async () => {
  dados = await PmoDados.quadro(t);
  if (primeiraVez) { soMeus = PmoMotor.abaInicialMeus(dados.itens, dados.meuId); primeiraVez = false; }   // depois disso vale a escolha da pessoa
  desenha();
});
document.getElementById("todos").onclick = () => { soMeus = false; if (dados) desenha(); };
document.getElementById("meus").onclick = () => { soMeus = true; if (dados) desenha(); };
</script>
</body>
</html>
