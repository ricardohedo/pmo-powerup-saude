<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de saúde do quadro</title>
<link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./motor.js?v=202611131545"></script>
<script src="./dados.js?v=202611131545"></script>
<style>
 body{font:14px/1.45 system-ui,sans-serif;padding:12px;color:#172b4d}
 .sem{display:flex;gap:8px;margin-bottom:14px}
 .sem div{flex:1;border-radius:6px;padding:10px;text-align:center;color:#fff}
 .sem b{display:block;font-size:26px}
 .v{background:#c0392b}.a{background:#b8860b}.g{background:#2e7d4f}
 h3{margin:16px 0 6px} ul{margin:0;padding-left:18px} .nota{color:#5e6c84;font-size:12px}
</style>
</head>
<body>
<div id="raiz">Lendo o quadro…</div>
<script>
const t = TrelloPowerUp.iframe();
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lista = (arr, f, vazio) => arr.length ? "<ul>" + arr.slice(0, 8).map(f).join("") + (arr.length > 8 ? "<li>… e mais " + (arr.length - 8) + "</li>" : "") + "</ul>" : "<p class='nota'>" + vazio + "</p>";
const indicadores = (k) => !k.ativos ? "" :
  "<h3>Indicadores do quadro (" + k.ativos + " projetos ativos)</h3><ul>" +
  "<li>Atrasados: <b>" + k.atrasados.pct + "%</b> (" + k.atrasados.qtd + ")</li>" +
  "<li>Sem prazo cadastrado: <b>" + k.semPrazo.pct + "%</b> (" + k.semPrazo.qtd + ")</li>" +
  "<li>Sem responsável: <b>" + k.semResponsavel.pct + "%</b> (" + k.semResponsavel.qtd + ")</li>" +
  "<li>Progresso médio dos checklists: <b>" + (k.progressoMedio === null ? "sem checklists" : k.progressoMedio + "%") + "</b>" + (k.comChecklist ? " (" + k.comChecklist + " projetos com checklist)" : "") + "</li></ul>" +
  "<p class='nota'>Calculado pelas regras do PMO sobre os projetos ativos (fora de Backlog e Concluídos); pode diferir do portal.</p>";
PmoDados.render(t, async () => {
  const q = await PmoDados.quadro(t), r = q.resumo, g = q.regras.grupos;
  const link = (x) => "<a href='" + esc(x.url) + "' target='_blank' rel='noopener noreferrer'>" + esc(x.nome) + "</a>";
  // Semaforo so dos projetos ATIVOS (mesma conta da Tendencia): fora Backlog, Concluidos e listas ignoradas.
  const ret = PmoMotor.retrato(q.itens, q.regras, new Date());
  document.getElementById("raiz").innerHTML =
    "<div class='sem'><div class='v'><b>" + ret.v + "</b>Atenção</div><div class='a'><b>" + ret.a + "</b>De olho</div><div class='g'><b>" + (ret.n - ret.v - ret.a) + "</b>Em dia</div></div>" +
    "<p class='nota'>Semáforo dos " + ret.n + " projetos ativos.</p>" +
    indicadores(PmoMotor.indicadoresQuadro(q.itens, q.regras)) +
    "<h3>Atrasos de " + q.regras.painel_atraso_dias + "+ dias</h3>" + lista(r.atrasos_longos, (x) => "<li>" + link(x) + " — " + x.dias + "d</li>", "Nenhum.") +
    "<h3>Prazo curto e pouco andado</h3>" + lista(r.prazo_curto_pouco_andado, (x) => "<li>" + link(x) + " — vence em " + x.dias + "d, " + (x.pct === null ? "sem checklist" : x.pct + "% feito") + "</li>", "Nenhum.") +
    "<h3>Quase prontos (vale reconhecer)</h3>" + lista(r.quase_prontos, (x) => "<li>" + link(x) + "</li>", "Nenhum.") +
    (q.regras.funcoes.evidencia ? "<h3>Concluídos sem evidência (últimos " + q.regras.evidencia_dias + " dias)</h3>" + lista(q.itens.filter((i) => i.semEvidencia).map((i) => ({ nome: i.card.name, url: i.card.url })), (x) => "<li>" + link(x) + "</li>", "Nenhum.") : "") +
    "<h3>Cadastro incompleto</h3>" + lista(r.cadastro, (x) => "<li>" + link(x) + " — falta: " + esc(x.falta) + "</li>", "Nenhum.") +
    "<h3>Por tipo de sinal</h3>" + lista(q.regras.ordem.filter((k) => r.por_tipo[k]), (k) => "<li>" + esc(g[k]) + ": " + r.por_tipo[k] + "</li>", "Nenhum.") +
    "<p class='nota'>" + r.total + " cards abertos lidos. Pausado e em revisão sem comentário usam a contagem de comentários do Trello. Só leitura; nada é alterado.</p>";
  t.sizeTo("#raiz");
});
</script>
</body>
</html>
