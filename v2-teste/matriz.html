<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matriz impacto × esforço</title>
<link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./motor.js?v=202611051634"></script>
<script src="./dados.js?v=202611051634"></script>
<style>
 body{font:14px/1.45 system-ui,sans-serif;padding:12px;color:#172b4d}
 table.m{border-collapse:separate;border-spacing:6px;width:100%;table-layout:fixed}
 table.m th{font-size:12px;color:#5e6c84;font-weight:600;text-align:center}
 table.m th.l{width:70px;text-align:right;vertical-align:middle}
 .cel{border:1px solid #dfe1e6;border-radius:6px;padding:6px 8px;vertical-align:top;min-height:70px;background:#fafbfc}
 .cel.faz{background:#e3fcef;border-color:#abf5d1}.cel.plan{background:#fff7e0;border-color:#f5cd47}
 .cel.vit{background:#e9f2ff;border-color:#9ec5ff}.cel.rev{background:#fdecea;border-color:#f5a39b}
 .cel h4{margin:0 0 4px;font-size:12px}.cel .n{float:right;font-weight:700}
 .cel a{display:block;color:#172b4d;text-decoration:none;font-size:12px;padding:1px 0} .cel a:hover{text-decoration:underline}
 .tag{display:inline-block;padding:0 5px;border-radius:8px;color:#fff;font-size:10px;font-weight:600;margin-right:4px}
 .tag.P1{background:#c0392b}.tag.P2{background:#d9730d}.tag.P3{background:#b8860b}.tag.P4{background:#2e7d4f}
 h3{margin:16px 0 6px}.nota{color:#5e6c84;font-size:12px}
 .sem{border:1px solid #dfe1e6;border-left:5px solid #b8860b;border-radius:4px;padding:5px 10px;margin:0 0 5px}
</style>
</head>
<body>
<div id="raiz">Lendo o quadro…</div>
<script>
const t = TrelloPowerUp.iframe();
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const NIVEIS = ["alto", "medio", "baixo"], ROT = { alto: "Alto", medio: "Médio", baixo: "Baixo" };
const ESFORCO = ["baixo", "medio", "alto"];                         // colunas: do mais barato ao mais caro
const NOME = { "alto|baixo": ["faz", "Fazer primeiro"], "alto|alto": ["plan", "Planejar com cuidado"], "baixo|baixo": ["vit", "Vitórias rápidas"], "baixo|alto": ["rev", "Reavaliar"] };

t.render(async () => {
  const q = await PmoDados.quadro(t), m = PmoMotor.matrizImpactoEsforco(q.itens, q.regras);
  let h = "<table class='m'><tr><th class='l'></th>" + ESFORCO.map((e) => "<th>Esforço " + ROT[e].toLowerCase() + "</th>").join("") + "</tr>";
  for (const imp of NIVEIS) {
    h += "<tr><th class='l'>Impacto " + ROT[imp].toLowerCase() + "</th>";
    for (const esf of ESFORCO) {
      const k = imp + "|" + esf, lista = m.celulas[k] || [], nome = NOME[k];
      h += "<td class='cel " + (nome ? nome[0] : "") + "'>" + (nome ? "<h4>" + nome[1] + "<span class='n'>" + lista.length + "</span></h4>" : "<h4><span class='n'>" + lista.length + "</span></h4>") +
        lista.map((x) => "<a href='" + esc(x.url) + "' target='_blank'>" + (x.prioridade ? "<span class='tag " + x.prioridade + "'>" + x.prioridade + "</span>" : "") + esc(x.nome) + "</a>").join("") + "</td>";
    }
    h += "</tr>";
  }
  h += "</table>";
  if (m.semClassificar.length) h += "<h3>Sem classificar (" + m.semClassificar.length + ")</h3>" + m.semClassificar.map((x) =>
    "<div class='sem'><a href='" + esc(x.url) + "' target='_blank'>" + esc(x.nome) + "</a> <span class='nota'>· falta: " + esc(x.falta.join(" e ")) + "</span></div>").join("");
  h += "<p class='nota'>Projetos não concluídos, pelos campos <b>Impacto no negócio</b> e <b>Esforço estimado</b> do card. Comece pelo verde (alto impacto, pouco esforço); revise o vermelho (baixo impacto, muito esforço). Só leitura; nada é alterado.</p>";
  document.getElementById("raiz").innerHTML = h;
  t.sizeTo("#raiz").catch(() => {});
});
</script>
</body>
</html>
