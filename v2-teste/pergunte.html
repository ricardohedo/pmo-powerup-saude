<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pergunte ao PMO</title>
<link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./motor.js?v=202611131739"></script>
<script src="./dados.js?v=202611131739"></script>
<script src="./pergunte.js?v=202611131739"></script>
<script src="./pergunte_log.js?v=202611131739"></script>
<script src="./perfil.js?v=202611131739"></script>
<style>
 body{font:14px/1.45 system-ui,sans-serif;padding:12px;color:#172b4d}
 h3{margin:14px 0 6px;font-size:14px} .nota{color:#5e6c84;font-size:12px}
 .busca{display:flex;gap:6px} .busca input{flex:1;padding:6px 8px;border:1px solid #c1c7d0;border-radius:4px;font:inherit}
 .perg{display:block;width:100%;text-align:left;margin:0 0 4px;padding:6px 8px;border:1px solid #dfe1e6;border-radius:4px;background:#fff;color:#172b4d;cursor:pointer;font:inherit}
 .perg:hover{background:#f4f5f7}
 .resp{background:#e9f2ff;border-radius:4px;padding:10px;margin:10px 0}
 .resp.naosei{background:#fff4e5}
 ul{margin:6px 0 0;padding-left:18px} li{margin:0 0 4px} a{color:#172b4d}
 .mot{color:#5e6c84;font-size:12px}
</style>
</head>
<body>
<div id="raiz">Lendo o quadro…</div>
<script>
const t = TrelloPowerUp.iframe();
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let ultima = "";          // a ultima resposta fica guardada: se o Trello redesenhar a janela, o gestor nao perde o que estava lendo
PmoDados.render(t, async () => {
  const q = await PmoDados.quadro(t), agora = new Date();
  const perfil = await PmoPerfil.atual(t, q.regras);                  // perfil curto = menos itens por resposta
  q.regras = { ...q.regras, bom_dia_max_itens: PmoMotor.limiteDoPerfil(perfil, q.regras) };
  const raiz = document.getElementById("raiz");
  let caderno = [];
  try { caderno = await PmoPerguntas.ler(t); } catch (e) { /* sem caderno: segue sem a lista */ }
  const botoes = (lista) => lista.map((c) => "<button class='perg' data-id='" + esc(c.id) + "'>" + esc(c.pergunta) + "</button>").join("");
  const botoesProjeto = (lista) => lista.map((it) => "<button class='perg' data-card='" + esc(it.card.id) + "'>" + esc(it.card.name) + " <span class='mot'>— " + esc(it.listaNome || "") + "</span></button>").join("");
  const resposta = (r, naoSei) => "<div class='resp" + (naoSei ? " naosei" : "") + "'><b>" + (r.url ? "<a href='" + esc(r.url) + "' target='_blank' rel='noopener noreferrer'>" + esc(r.titulo) + "</a>" : esc(r.titulo)) + "</b><br>" + esc(r.resumo) +
    (r.itens.length ? "<ul>" + r.itens.map((x) => "<li>" + (x.url ? "<a href='" + esc(x.url) + "' target='_blank' rel='noopener noreferrer'>" + esc(x.texto) + "</a>" : "<b>" + esc(x.texto) + "</b>") +
      (x.detalhe ? " <span class='mot'>— " + esc(x.detalhe) + "</span>" : "") + "</li>").join("") +
      (r.mais ? "<li class='mot'>… e mais " + r.mais + "</li>" : "") + "</ul>" : "") +
    (r.nota ? "<p class='nota'>" + esc(r.nota) + "</p>" : "") + "</div>";
  const anotadas = () => caderno.length ? "<h3>Perguntas que o bot ainda não sabe (o PMO vai ensinar)</h3><ul>" + caderno.slice(-5).reverse().map((x) => "<li class='mot'>" + esc(x.q) + "</li>").join("") + "</ul>" : "";

  function desenha(htmlResposta) {
    ultima = htmlResposta || "";
    raiz.innerHTML = "<div class='busca'><input id='texto' type='search' placeholder='Digite uma pergunta, palavras ou o nome de um projeto' aria-label='Pergunta'>" +
      "<button id='ir'>Perguntar</button></div><div id='resp'>" + (htmlResposta || "") + "</div><h3>Perguntas prontas</h3>" + botoes(PmoPergunte.CATALOGO) +
      anotadas() + "<p class='nota'>Respostas montadas por regra com os dados deste quadro, sem inteligência artificial. Só leitura; o que o bot não souber fica anotado neste quadro para o PMO melhorar.</p>";
    ligar(raiz);
    const input = document.getElementById("texto");
    document.getElementById("ir").onclick = () => pergunta(input.value);
    input.onkeydown = (e) => { if (e.key === "Enter") pergunta(input.value); };
    t.sizeTo("#raiz");
  }
  function ligar(escopo) {
    escopo.querySelectorAll(".perg[data-id]").forEach((b) => { b.onclick = () => desenha(resposta(PmoPergunte.responder(b.dataset.id, q.itens, q.regras, q.meuId, agora), false)); });
    escopo.querySelectorAll(".perg[data-card]").forEach((b) => {
      b.onclick = () => { const it = q.itens.find((x) => x.card.id === b.dataset.card); if (it) desenha(resposta(PmoPergunte.responderProjeto(it, q.regras, agora), false)); };
    });
  }
  async function pergunta(texto) {
    if (String(texto || "").trim().length < 3) return;
    const e = PmoPergunte.entender(texto, q.itens);
    if (e.tipo === "projeto" && e.itens.length === 1) { desenha(resposta(PmoPergunte.responderProjeto(e.itens[0], q.regras, agora), false)); return; }
    if (e.tipo === "projeto" || e.tipo === "talvez_projeto") {
      document.getElementById("resp").innerHTML = "<div class='resp'><b>Qual destes projetos?</b>" + botoesProjeto(e.itens) + "</div>"; ligar(document.getElementById("resp")); t.sizeTo("#raiz"); return;
    }
    if (e.tipo === "catalogo" && e.perguntas.length === 1) { desenha(resposta(PmoPergunte.responder(e.perguntas[0].id, q.itens, q.regras, q.meuId, agora), false)); return; }
    if (e.tipo === "catalogo") {
      document.getElementById("resp").innerHTML = "<div class='resp'><b>Você quis dizer:</b>" + botoes(e.perguntas) + "</div>"; ligar(document.getElementById("resp")); t.sizeTo("#raiz"); return;
    }
    // nao soube: anota para o PMO ensinar o bot (a unica escrita desta tela) e diz com honestidade
    try { await PmoPerguntas.registrar(t, texto, agora); caderno = await PmoPerguntas.ler(t); } catch (err) { /* sem permissao de gravar: so nao anota */ }
    desenha(resposta(PmoPergunte.naoSei(q.regras), true));
  }
  desenha(ultima);
});
</script>
</body>
</html>
