<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status semanal</title>
<link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./motor.js?v=202611061437"></script>
<script src="./dados.js?v=202611061437"></script>
<style>textarea{width:100%;height:190px;font:13px/1.4 system-ui,sans-serif} .nota{color:#5e6c84;font-size:12px}</style>
</head>
<body>
<textarea id="txt" readonly>Montando o rascunho…</textarea>
<button id="copiar" class="mod-primary">Copiar texto</button>
<p class="nota">Rascunho montado só do que está no card (checklist, prazo e alertas). Nada é gravado no Trello: cole onde precisar.</p>
<script>
const t = TrelloPowerUp.iframe();
t.render(async () => {
  const d = await PmoDados.cardEmFoco(t);
  const hoje = new Date().toLocaleDateString("pt-BR");
  document.getElementById("txt").value = PmoMotor.textoStatus(d.card, d.lista, d.checklists, d.alertas, d.regras, hoje);
  t.sizeTo("body");
});
document.getElementById("copiar").onclick = () => {
  const el = document.getElementById("txt"); el.select(); document.execCommand("copy");
};
</script>
</body>
</html>
